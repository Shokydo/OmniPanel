<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Белый список</title>
<style>
  :root {
    --bg: #0f1014; --panel: #16181d; --panel3: #1e2128; --line: #2a2d36;
    --text: #e8eaf0; --dim: #9aa0ae; --accent: #8ab4ff;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px; --r-circle: 50%; --r-card: 12px;
    --font: 12.4px/1.45 "Segoe UI", system-ui, sans-serif;
    --mono: 12px/1.5 "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: var(--font); padding: 14px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .title { font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 11.5px; }
  .grow { flex: 1 1 auto; }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track { position: relative; width: 38px; height: 20px; border-radius: var(--r-pill);
    background: var(--panel3); border: 1px solid var(--line); transition: .15s; flex: 0 0 auto; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: var(--r-circle); background: var(--dim); transition: .15s; }
  .switch input:checked + .track { background: color-mix(in srgb, var(--accent) 30%, var(--panel3)); border-color: var(--accent); }
  .switch input:checked + .track::after { left: 20px; background: var(--accent); }
  .switch .lbl { font-size: 12px; }

  .addbar { display: flex; gap: 8px; margin: 4px 0 12px; flex-wrap: wrap; }
  input[type="text"] { flex: 1 1 200px; min-width: 140px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; font: var(--font); outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  button { background: var(--panel3); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 8px 12px; font: var(--font); cursor: pointer; transition: .12s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: color-mix(in srgb, var(--accent) 22%, var(--panel3)); border-color: var(--accent); }
  button.icon { padding: 5px 8px; color: var(--dim); }
  button.icon:hover { color: var(--text); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  th { color: var(--dim); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  td.uuid { font: var(--mono); color: var(--dim); font-size: 11.5px; }
  td.act { width: 44px; text-align: right; }
  .empty { padding: 22px; text-align: center; color: var(--dim); }

  #hint { margin-top: 10px; color: var(--dim); font-size: 11.5px; min-height: 16px; }
  #hint.warn { color: #e0b34a; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <div class="title">Белый список</div>
      <div class="sub">Кого пускать на сервер</div>
    </div>
    <div class="grow"></div>
    <label class="switch">
      <input type="checkbox" id="on">
      <span class="track"></span>
      <span class="lbl">white-list</span>
    </label>
  </div>

  <div class="addbar">
    <input type="text" id="nick" placeholder="Ник игрока" autocomplete="off" spellcheck="false">
    <button class="primary" id="add">Добавить</button>
    <button id="reload">Обновить</button>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Игрок</th><th>UUID</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="hint"></div>

<script>
(function () {
  var S = { server: null, items: [], whiteList: false, busy: false };
  var rid = 0;
  var waits = new Map();
  var $ = function (id) { return document.getElementById(id); };

  function call(method, args) {
    return new Promise(function (resolve) {
      var id = ++rid;
      waits.set(id, resolve);
      parent.postMessage({ omni: 1, rid: id, method: method, args: args || [] }, '*');
      setTimeout(function () {
        if (waits.has(id)) { waits.delete(id); resolve({ ok: false, error: 'Панель не ответила' }); }
      }, 20000);
    });
  }

  function applyTheme(t) {
    if (!t) return;
    var r = document.documentElement.style;
    var map = { bg: '--bg', panel: '--panel', panel3: '--panel3', line: '--line',
      text: '--text', dim: '--dim', accent: '--accent' };
    Object.keys(map).forEach(function (k) { if (t[k]) r.setProperty(map[k], t[k]); });
    var rad = t.radius || {};
    var rmap = { xs: '--r-xs', sm: '--r-sm', md: '--r-md', lg: '--r-lg',
      pill: '--r-pill', circle: '--r-circle', card: '--r-card' };
    Object.keys(rmap).forEach(function (k) { if (rad[k]) r.setProperty(rmap[k], rad[k]); });
  }

  function hint(text, warn) {
    var el = $('hint');
    el.textContent = text || '';
    el.className = warn ? 'warn' : '';
  }

  function show(items) {
    S.items = items;
    var body = $('rows');
    body.textContent = '';
    if (!items.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 3; td.className = 'empty';
      td.textContent = 'Пока пусто — добавь ник выше';
      tr.appendChild(td); body.appendChild(tr);
      return;
    }
    items.forEach(function (it, i) {
      var tr = document.createElement('tr');
      var n = document.createElement('td');
      n.className = 'name';
      n.textContent = it.name || '—';
      var u = document.createElement('td');
      u.className = 'uuid';
      u.textContent = it.uuid && /-/.test(it.uuid) ? it.uuid : '— нет uuid —';
      var a = document.createElement('td');
      a.className = 'act';
      var del = document.createElement('button');
      del.className = 'icon';
      del.textContent = '✕';
      del.dataset.i = String(i);
      del.addEventListener('click', function () {
        S.items.splice(i, 1);
        save().then(function () { show(S.items); hint('Игрок убран из белого списка'); });
      });
      a.appendChild(del);
      tr.appendChild(n); tr.appendChild(u); tr.appendChild(a);
      body.appendChild(tr);
    });
  }

  async function readProps() {
    var res = await call('read', ['server.properties']);
    var text = res && res.ok && res.data ? String(res.data.content || '') : '';
    var m = text.match(/^white-list\s*=\s*(.*)$/m);
    S.whiteList = !!(m && m[1].trim() === 'true');
    $('on').checked = S.whiteList;
  }

  async function load() {
    var res = await call('read', ['whitelist.json']);
    var items = [];
    if (res && res.ok && res.data) {
      try {
        var parsed = JSON.parse(String(res.data.content || '[]'));
        if (Array.isArray(parsed)) items = parsed.map(function (x) {
          return { uuid: String((x && x.uuid) || ''), name: String((x && x.name) || '') };
        });
      } catch (e) { hint('whitelist.json не читается как список — покажу пустым', true); }
    }
    show(items);
    await readProps();
    updateHint();
  }

  function updateHint() {
    var state = S.whiteList ? 'Белый список включён' : 'Белый список выключен';
    var tail = S.server && S.server.running
      ? '· применён на сервере'
      : '· сервер не запущен — применится при следующем запуске';
    hint(state + ' ' + tail);
  }

  async function save() {
    var payload = JSON.stringify(S.items.map(function (x) {
      return { uuid: x.uuid || '', name: x.name || '' };
    }), null, 2);
    var res = await call('write', ['whitelist.json', payload]);
    if (!res || !res.ok) { hint('Не удалось записать whitelist.json: ' + ((res && res.error) || 'нет связи'), true); return false; }
    return true;
  }

  async function addPlayer() {
    if (S.busy) return;
    var nick = ($('nick').value || '').trim();
    if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) { hint('Ник — от 3 до 16 латинских букв, цифр или _', true); return; }
    if (S.items.some(function (x) { return (x.name || '').toLowerCase() === nick.toLowerCase(); })) {
      hint('Такой игрок уже в списке', true); return;
    }
    S.busy = true;
    $('add').disabled = true;
    hint('Спрашиваю UUID у Mojang…');
    var looked = await call('lookupUuid', [nick]);
    var uuid = looked && looked.ok && looked.data ? String(looked.data.uuid || '') : '';
    S.items.push({ uuid: uuid, name: nick });
    var written = await save();
    if (written) {
      show(S.items);
      if (S.server && S.server.running) {
        var r = await call('command', ['whitelist reload']);
        hint(r && r.ok
          ? 'Игрок добавлен, на сервере выполнен whitelist reload'
          : 'Игрок добавлен · перезагрузить список не удалось: ' + ((r && r.error) || 'нет связи'));
      } else if (!uuid) {
        hint('Игрок добавлен без UUID — сервер подставит его при входе', true);
      } else {
        hint('Игрок добавлен · сервер не запущен — применится при следующем запуске');
      }
      $('nick').value = '';
    }
    S.busy = false;
    $('add').disabled = false;
  }

  async function toggleWhiteList() {
    var on = $('on').checked;
    var patch = {};
    patch['white-list'] = on;
    var res = await call('props', [patch]);
    if (!res || !res.ok) { $('on').checked = !on; hint('Не удалось изменить server.properties', true); return; }
    S.whiteList = on;
    if (S.server && S.server.running) await call('command', ['whitelist reload']);
    updateHint();
  }

  $('add').addEventListener('click', addPlayer);
  $('nick').addEventListener('keydown', function (e) { if (e.key === 'Enter') addPlayer(); });
  $('reload').addEventListener('click', function () { load(); });
  $('on').addEventListener('change', toggleWhiteList);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.omni !== 2) return;
    if (d.type === 'init-ok') {
      applyTheme(d.theme);
      S.server = d.server;
      load();
      return;
    }
    if (d.type === 'theme') { applyTheme(d.theme); return; }
    if (d.type === 'server-changed') { S.server = d.server; updateHint(); return; }
    var w = waits.get(d.rid);
    if (w) { waits.delete(d.rid); w(d); }
  });

  call('init', []).then(function (res) {
    if (res && res.ok === false) hint(res.error || 'Панель не ответила', true);
  });
})();
</script>
</body>
</html>
