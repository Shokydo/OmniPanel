<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0f1014; --bg2: #16181d; --bg3: #1e2128; --line: #2a2d36;
    --text: #e8eaf0; --dim: #9aa0ae; --accent: #8ab4ff; --ok: #78d39a; --warn: #d9a13b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; font: 13px/1.45 "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }
  h2 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input[type="text"] {
    flex: 1 1 200px; min-width: 140px; background: var(--bg2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button { background: var(--bg3); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    display: flex; align-items: center; gap: 10px; background: var(--bg2);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  }
  .ava {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 6px; overflow: hidden;
    background: var(--bg3); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--dim);
  }
  .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nm { flex: 1 1 auto; min-width: 0; }
  .nm b { font-weight: 600; }
  .nm span { display: block; color: var(--dim); font-size: 11px; font-family: Consolas, monospace; }
  .item button { padding: 4px 10px; font-size: 12px; }
  .row2 { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .switchrow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--dim); }
  .sw { width: 34px; height: 18px; border-radius: 999px; background: var(--bg3); border: 1px solid var(--line); position: relative; cursor: pointer; flex: 0 0 34px; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); transition: transform .14s, background .14s; }
  .sw.on { background: var(--text); border-color: var(--text); }
  .sw.on::after { transform: translateX(16px); background: var(--bg); }
  .empty { color: var(--dim); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; }
  .status { color: var(--dim); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--warn); }
</style>
</head>
<body>
  <h2>Белый список</h2>
  <div class="sub" id="sub">читаю whitelist.json…</div>

  <div class="bar">
    <input id="nick" type="text" placeholder="ник игрока" spellcheck="false" />
    <button id="add" class="primary">Добавить</button>
    <button id="reload">Обновить</button>
  </div>

  <div id="list" class="list"></div>

  <div class="row2">
    <div class="switchrow"><span id="swlbl">белый список выключен</span><i id="sw" class="sw"></i></div>
  </div>
  <div id="status" class="status"></div>

<script>
(function () {
  let rid = 0;
  const waiting = new Map();
  const state = { names: [], whiteList: false, server: null, busy: false };

  function call(method, args) {
    return new Promise((resolve) => {
      const id = ++rid;
      waiting.set(id, resolve);
      parent.postMessage({ omni: 1, rid: id, method: method, args: args || [] }, '*');
      setTimeout(() => { if (waiting.has(id)) { waiting.delete(id); resolve({ ok: false, error: 'нет ответа' }); } }, 15000);
    });
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.omni !== 2) return;
    if (d.type === 'theme') { applyTheme(d.theme || {}); return; }
    if (d.type === 'init-ok') {
      state.server = d.server;
      applyTheme(d.theme || {});
      load();
      return;
    }
    if (d.type === 'server-changed') { state.server = d.server; load(); return; }
    const cb = waiting.get(d.rid);
    if (cb) { waiting.delete(d.rid); cb(d); }
  });

  function applyTheme(t) {
    const r = document.documentElement.style;
    if (t.bg) r.setProperty('--bg', t.bg);
    if (t.panel) r.setProperty('--bg2', t.panel);
    if (t.panel3) r.setProperty('--bg3', t.panel3);
    if (t.line) r.setProperty('--line', t.line);
    if (t.text) r.setProperty('--text', t.text);
    if (t.dim) r.setProperty('--dim', t.dim);
    if (t.accent) r.setProperty('--accent', t.accent);
  }

  const el = (id) => document.getElementById(id);
  const setStatus = (t, k) => { const s = el('status'); s.textContent = t || ''; s.className = 'status' + (k ? ' ' + k : ''); };

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function render() {
    const host = el('list');
    el('sub').textContent = state.names.length ? 'игроков в списке: ' + state.names.length : 'список пуст';
    if (!state.names.length) { host.innerHTML = '<div class="empty">никого нет — добавь первого</div>'; return; }
    host.innerHTML = '';
    for (const it of state.names) {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = '<span class="ava">' + esc((it.name || '?').slice(0, 1).toUpperCase()) + '</span>'
        + '<span class="nm"><b>' + esc(it.name || '') + '</b><span>' + esc(it.uuid || 'без uuid') + '</span></span>'
        + '<button data-name="' + esc(it.name || '') + '">Убрать</button>';
      host.appendChild(row);
    }
    el('swlbl').textContent = state.whiteList ? 'белый список включён' : 'белый список выключен';
    el('sw').className = 'sw' + (state.whiteList ? ' on' : '');
    for (const img of host.querySelectorAll('.ava')) {
      const name = img.parentElement.querySelector('b').textContent;
      const im = document.createElement('img');
      im.src = 'https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/32';
      im.onload = () => { img.textContent = ''; img.appendChild(im); };
      im.onerror = () => {};
    }
  }

  async function load() {
    const res = await call('read', ['whitelist.json']);
    let entries = [];
    if (res.ok && res.data && res.data.exists !== false) {
      try {
        const parsed = JSON.parse(res.data.content || '[]');
        if (Array.isArray(parsed)) entries = parsed;
      } catch { setStatus('whitelist.json не разобрать как JSON', 'bad'); }
    }
    state.names = entries.map((x) => ({ name: x && x.name, uuid: x && x.uuid }));
    /* у старых записей uuid пустой — подтягиваем его у Mojang, чтобы список был полным */
    if (state.names.some((x) => !x.uuid)) fillUuids();
    const props = await call('read', ['server.properties']);
    if (props.ok) {
      const m = String(props.data.content || '').match(/^white-list=(.*)$/m);
      state.whiteList = !!(m && m[1].trim() === 'true');
    }
    render();
  }

  async function fillUuids() {
    let changed = false;
    for (const it of state.names.slice(0, 30)) {
      if (it.uuid || !it.name) continue;
      const res = await call('lookupUuid', [it.name]);
      if (res.ok && res.data && res.data.uuid) { it.uuid = res.data.uuid; changed = true; }
    }
    if (!changed) return;
    render();
    await save(state.names);
  }

  async function save(entries) {
    const text = JSON.stringify(entries.map((x) => ({ uuid: x.uuid || '', name: x.name })), null, 2);
    const res = await call('write', ['whitelist.json', text]);
    if (!res.ok) { setStatus('не записалось: ' + (res.error || ''), 'bad'); return false; }
    return true;
  }

  async function addNick() {
    if (state.busy) return;
    const raw = el('nick').value.trim();
    if (!raw) { setStatus('впиши ник', 'bad'); return; }
    if (!/^[A-Za-z0-9_]{3,16}$/.test(raw)) { setStatus('ник: 3–16 символов, латиница, цифры, _', 'bad'); return; }
    if (state.names.some((x) => (x.name || '').toLowerCase() === raw.toLowerCase())) { setStatus('такой игрок уже в списке', 'bad'); return; }
    state.busy = true;
    setStatus('ищу uuid…');
    const uuidRes = await call('lookupUuid', [raw]);
    const uuid = uuidRes.ok && uuidRes.data && uuidRes.data.uuid ? uuidRes.data.uuid : '';
    const next = state.names.concat([{ name: raw, uuid }]);
    if (await save(next)) {
      state.names = next;
      el('nick').value = '';
      render();
      setStatus(uuid ? 'добавлен ' + raw : 'добавлен ' + raw + ' (uuid не найден — сервер подставит сам)', 'ok');
      call('command', ['whitelist add ' + raw]);
    }
    state.busy = false;
  }

  el('add').onclick = addNick;
  el('nick').addEventListener('keydown', (e) => { if (e.key === 'Enter') addNick(); });
  el('reload').onclick = load;
  el('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-name]');
    if (!btn) return;
    const name = btn.getAttribute('data-name');
    const next = state.names.filter((x) => x.name !== name);
    if (await save(next)) {
      state.names = next;
      render();
      setStatus('убран ' + name, 'ok');
      call('command', ['whitelist remove ' + name]);
    }
  });
  el('sw').onclick = async () => {
    const next = !state.whiteList;
    const res = await call('props', [{ 'white-list': next }]);
    if (!res.ok) { setStatus('не записалось в server.properties', 'bad'); return; }
    state.whiteList = next;
    render();
    setStatus(next ? 'белый список включён' : 'белый список выключен', 'ok');
    call('command', ['whitelist ' + (next ? 'on' : 'off')]);
  };

  parent.postMessage({ omni: 1, rid: 0, method: 'init', args: [] }, '*');
})();
</script>
</body>
</html>
