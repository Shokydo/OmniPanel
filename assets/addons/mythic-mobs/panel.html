<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0f1014; --bg2: #16181d; --bg3: #1e2128; --line: #2a2d36;
    --text: #e8eaf0; --dim: #9aa0ae; --accent: #8ab4ff; --ok: #78d39a; --warn: #d9a13b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px; font: 13px/1.45 "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h2 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input[type="text"] {
    flex: 1 1 180px; min-width: 120px; background: var(--bg2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: var(--bg3); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  button.primary:hover { opacity: .88; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .mob {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .mob .ico {
    width: 34px; height: 34px; flex: 0 0 34px; border-radius: 8px; background: var(--bg3);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--dim);
  }
  .mob .body { flex: 1 1 auto; min-width: 0; }
  .mob .name { font-weight: 650; }
  .mob .row { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .mob .acts { display: flex; gap: 6px; flex: 0 0 auto; }
  .mob .acts button { padding: 5px 10px; font-size: 12px; }
  .badge { font-size: 10.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--dim); }
  .badge.bad { border-color: var(--warn); color: var(--warn); }
  .empty { color: var(--dim); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; }
  .status { color: var(--dim); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--warn); }
  pre {
    margin: 8px 0 0; padding: 10px; background: var(--bg3); border: 1px solid var(--line);
    border-radius: 8px; max-height: 240px; overflow: auto; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h2>Мифические мобы</h2>
  <div class="sub" id="sub">читаю MythicMobs/Mobs…</div>

  <div class="bar">
    <input id="q" type="text" placeholder="поиск по имени или типу" spellcheck="false" />
    <button id="scan">Проверить файлы</button>
  </div>

  <div class="bar">
    <input id="newName" type="text" placeholder="имя нового моба, латиницей" spellcheck="false" />
    <button id="new" class="primary">Создать моба</button>
  </div>

  <div id="list" class="list"></div>
  <div id="status" class="status"></div>
  <pre id="preview" class="hidden"></pre>

<script>
(function () {
  let rid = 0;
  const waiting = new Map();
  const state = { files: [], filter: '', theme: {}, server: null, preview: '' };

  function call(method, args) {
    return new Promise((resolve) => {
      const id = ++rid;
      waiting.set(id, resolve);
      parent.postMessage({ omni: 1, rid: id, method: method, args: args || [] }, '*');
      setTimeout(() => {
        if (waiting.has(id)) { waiting.delete(id); resolve({ ok: false, error: 'нет ответа' }); }
      }, 15000);
    });
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.omni !== 2) return;
    if (d.type === 'theme') { applyTheme(d.theme || {}); return; }
    const cb = waiting.get(d.rid);
    if (cb) { waiting.delete(d.rid); cb(d); }
  });

  function applyTheme(t) {
    state.theme = t;
    const r = document.documentElement.style;
    if (t.bg) r.setProperty('--bg', t.bg);
    if (t.panel) r.setProperty('--bg2', t.panel);
    if (t.panel3) r.setProperty('--bg3', t.panel3);
    if (t.line) r.setProperty('--line', t.line);
    if (t.text) r.setProperty('--text', t.text);
    if (t.dim) r.setProperty('--dim', t.dim);
    if (t.accent) r.setProperty('--accent', t.accent);
  }

  const el = (id) => document.getElementById(id);
  const setStatus = (text, kind) => {
    const s = el('status');
    s.textContent = text || '';
    s.className = 'status' + (kind ? ' ' + kind : '');
  };

  /* в MythicMobs имя моба — это ключ верхнего уровня (или поле InternalName) */
  function nameOfYaml(text) {
    const inner = text.match(/^\s*InternalName:\s*(.+)$/m);
    if (inner) return inner[1].trim();
    const top = text.match(/^([A-Za-z0-9_-]+):/m);
    return top ? top[1] : '';
  }
  function typeOfYaml(text) {
    const m = text.match(/^\s*Type:\s*(.+)$/m);
    return m ? m[1].trim() : '';
  }
  function hpOfYaml(text) {
    const m = text.match(/^\s*Health:\s*(.+)$/m);
    return m ? m[1].trim() : '';
  }
  function problems(text) {
    const out = [];
    if (/\t/.test(text)) out.push('табуляция');
    if (!nameOfYaml(text)) out.push('нет имени моба');
    if (!/^\s*Type:/m.test(text)) out.push('нет Type');
    return out;
  }

  function render() {
    const host = el('list');
    const q = state.filter.trim().toLowerCase();
    const rows = state.files.filter((f) => !q
      || f.name.toLowerCase().includes(q)
      || (f.internal || '').toLowerCase().includes(q)
      || (f.type || '').toLowerCase().includes(q));
    el('sub').textContent = state.files.length
      ? 'файлов: ' + state.files.length + (state.server ? ' · ' + state.server.name : '')
      : 'в MythicMobs/Mobs пока нет файлов';
    if (!rows.length) {
      host.innerHTML = '<div class="empty">' + (state.files.length ? 'ничего не найдено' : 'мобов нет — создай первого') + '</div>';
      return;
    }
    host.innerHTML = '';
    for (const f of rows) {
      const card = document.createElement('div');
      card.className = 'mob';
      const bad = f.problems && f.problems.length;
      card.innerHTML =
        '<div class="ico">' + (f.internal || f.name).slice(0, 1).toUpperCase() + '</div>'
        + '<div class="body">'
        + '<div class="name">' + escapeHtml(f.internal || f.name) + '</div>'
        + '<div class="row">' + escapeHtml(f.type || 'тип не указан')
        + (f.health ? ' · здоровье ' + escapeHtml(f.health) : '')
        + ' <span class="badge' + (bad ? ' bad' : '') + '">'
        + (bad ? escapeHtml(f.problems.join(', ')) : 'в порядке') + '</span></div>'
        + '</div>'
        + '<div class="acts">'
        + '<button data-act="view" data-file="' + escapeAttr(f.path) + '">Показать</button>'
        + '<button data-act="edit" data-file="' + escapeAttr(f.path) + '">Редактор</button>'
        + '</div>';
      host.appendChild(card);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;');
  }

  async function loadFiles() {
    const res = await call('list', ['MythicMobs/Mobs']);
    if (!res.ok) {
      state.files = [];
      el('sub').textContent = 'папка MythicMobs/Mobs не найдена — поставь плагин MythicMobs';
      render();
      return;
    }
    const items = (res.data.items || []).filter((x) => !x.isDir && /\.(yml|yaml)$/i.test(x.name));
    const files = [];
    for (const it of items) {
      const read = await call('read', [it.path]);
      const text = read.ok ? (read.data.content || '') : '';
      files.push({
        name: it.name,
        path: it.path,
        internal: nameOfYaml(text),
        type: typeOfYaml(text),
        health: hpOfYaml(text),
        problems: problems(text),
      });
    }
    state.files = files;
    render();
  }

  async function checkAll() {
    if (!state.files.length) { setStatus('нечего проверять', 'bad'); return; }
    const bad = state.files.filter((f) => f.problems && f.problems.length);
    if (!bad.length) {
      setStatus('все файлы в порядке: ' + state.files.length + ' мобов', 'ok');
    } else {
      setStatus('проблемы: ' + bad.map((f) => f.name + ' — ' + f.problems.join(', ')).join('; '), 'bad');
    }
  }

  async function createMob() {
    const raw = el('newName').value.trim();
    if (!raw) { setStatus('впиши имя моба', 'bad'); return; }
    const name = raw.replace(/\s+/g, '_');
    if (!/^[A-Za-z0-9_-]{2,40}$/.test(name)) { setStatus('имя: латиница, цифры, _ и -', 'bad'); return; }
    const path = 'MythicMobs/Mobs/' + name + '.yml';
    const template = [
      name + ':',
      '  Type: ZOMBIE',
      '  Display: \'' + name + '\'',
      '  Health: 40',
      '  Damage: 6',
      '  Options:',
      '    MovementSpeed: 0.25',
      '    PreventOtherDrops: true',
      '  Skills:',
      '  - skill{s=Attack} @target ~onTimer:60',
      '',
    ].join('\n');
    const res = await call('write', [path, template]);
    if (!res.ok) { setStatus('не записалось: ' + (res.error || ''), 'bad'); return; }
    el('newName').value = '';
    setStatus('создан ' + path, 'ok');
    await loadFiles();
  }

  async function showPreview(path) {
    const res = await call('read', [path]);
    if (!res.ok) { setStatus('не прочитать файл', 'bad'); return; }
    const pre = el('preview');
    pre.textContent = res.data.content || '';
    pre.classList.remove('hidden');
    state.preview = path;
  }

  el('q').oninput = () => { state.filter = el('q').value; render(); };
  el('scan').onclick = checkAll;
  el('new').onclick = createMob;
  el('newName').addEventListener('keydown', (e) => { if (e.key === 'Enter') createMob(); });
  el('list').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const file = btn.getAttribute('data-file');
    if (btn.getAttribute('data-act') === 'view') showPreview(file);
    else call('openEditor', [file]);
  });

  parent.postMessage({ omni: 1, rid: 0, method: 'init', args: [] }, '*');
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.omni !== 2) return;
    if (d.type === 'init-ok') {
      state.server = d.server;
      if (d.theme) applyTheme(d.theme);
      loadFiles();
    }
    if (d.type === 'server-changed') { state.server = d.server; loadFiles(); }
  });
})();
</script>
</body>
</html>
