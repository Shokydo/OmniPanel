<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мифические мобы</title>
<style>
  :root {
    --bg: #0f1014; --panel: #16181d; --panel3: #1e2128; --line: #2a2d36;
    --text: #e8eaf0; --dim: #9aa0ae; --accent: #8ab4ff; --warn: #e0b34a; --bad: #e06c6c; --ok: #6cc78a;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px; --r-circle: 50%; --r-card: 12px;
    --font: 12.4px/1.45 "Segoe UI", system-ui, sans-serif;
    --mono: 12px/1.55 "Cascadia Mono", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: var(--font); padding: 14px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 2px; gap: 2px; margin-bottom: 12px; }
  .seg button { background: transparent; border: none; color: var(--dim); font: var(--font);
    padding: 6px 12px; border-radius: var(--r-xs); cursor: pointer; }
  .seg button.on { background: var(--panel3); color: var(--text); }
  .view { display: none; }
  .view.on { display: block; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card);
    padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .card p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
  pre { margin: 0; background: var(--panel3); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 10px 12px; font: var(--mono); overflow: auto; white-space: pre; color: var(--text); }
  code { font: var(--mono); background: var(--panel3); padding: 1px 5px; border-radius: var(--r-xs); }

  textarea { width: 100%; min-height: 170px; resize: vertical; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font: var(--mono); outline: none; }
  textarea:focus { border-color: var(--accent); }
  input[type="text"] { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 8px 10px; font: var(--mono); outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row .lbl { color: var(--dim); font-size: 11.5px; }
  .grow { flex: 1 1 auto; }
  button { background: var(--panel3); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 8px 12px; font: var(--font); cursor: pointer; transition: .12s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: color-mix(in srgb, var(--accent) 22%, var(--panel3)); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }

  #verdict { margin: 8px 0; color: var(--dim); font-size: 12px; min-height: 16px; }
  #verdict.warn { color: var(--warn); }
  #verdict.ok { color: var(--ok); }
  #verdict.bad { color: var(--bad); }

  #files .f { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-bottom: 1px solid var(--line); font-size: 12.5px; }
  #files .f:last-child { border-bottom: none; }
  #files .n { font: var(--mono); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  #files .st { color: var(--dim); font-size: 11.5px; }
  #files .st.bad { color: var(--warn); }
  #files .st.ok { color: var(--ok); }
  .panel-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
</style>
</head>
<body>
  <div class="seg">
    <button id="tabWiki" class="on">Вики</button>
    <button id="tabFix">Адаптация кода</button>
    <button id="tabFiles">Проверка файлов</button>
  </div>

  <div class="view on" id="vWiki">
    <div id="wikiList"></div>
  </div>

  <div class="view" id="vFix">
    <div class="card">
      <h3>Адаптация кода моба</h3>
      <p>Вставь код из старой вики или из чата — приведу его к современному синтаксису MythicMobs
        и сохраню в папку сервера.</p>
      <textarea id="src" spellcheck="false" placeholder="BadMob:&#10;  Type: ZOMBIE&#10;  Skills:&#10;    - ignite{ticks=40} @Target ~onAttack"></textarea>
      <div class="row">
        <button class="primary" id="fixBtn">Привести в порядок</button>
        <button id="saveBtn" disabled>Сохранить в сервер</button>
        <div class="grow"></div>
        <span class="lbl" id="pathLbl">Файл</span>
      </div>
      <input type="text" id="savePath" placeholder="MythicMobs/Mobs/Имя.yml" spellcheck="false">
      <div id="verdict"></div>
      <pre id="out"></pre>
    </div>
  </div>

  <div class="view" id="vFiles">
    <div class="card">
      <h3>Проверка файлов MythicMobs</h3>
      <p>Смотрю папку <code>MythicMobs/Mobs</code>: табуляция, пустые файлы, отсутствие <code>Type</code> и <code>Health</code>.</p>
      <div class="row">
        <button class="primary" id="scanBtn">Проверить</button>
        <div class="grow"></div>
        <span class="lbl" id="scanInfo"></span>
      </div>
      <div class="panel-card" id="files"></div>
    </div>
  </div>

<script>
(function () {
  var S = { server: null, theme: null, fixed: '', path: '' };
  var rid = 0;
  var waits = new Map();
  var $ = function (id) { return document.getElementById(id); };

  function call(method, args) {
    return new Promise(function (resolve) {
      var id = ++rid;
      waits.set(id, resolve);
      parent.postMessage({ omni: 1, rid: id, method: method, args: args || [] }, '*');
      setTimeout(function () {
        if (waits.has(id)) { waits.delete(id); resolve({ ok: false, error: 'Панель не ответила' }); }
      }, 20000);
    });
  }

  function applyTheme(t) {
    if (!t) return;
    S.theme = t;
    var r = document.documentElement.style;
    var map = { bg: '--bg', panel: '--panel', panel3: '--panel3', line: '--line',
      text: '--text', dim: '--dim', accent: '--accent' };
    Object.keys(map).forEach(function (k) { if (t[k]) r.setProperty(map[k], t[k]); });
    var rad = t.radius || {};
    var rmap = { xs: '--r-xs', sm: '--r-sm', md: '--r-md', lg: '--r-lg',
      pill: '--r-pill', circle: '--r-circle', card: '--r-card' };
    Object.keys(rmap).forEach(function (k) { if (rad[k]) r.setProperty(rmap[k], rad[k]); });
  }

  function verdict(text, cls) {
    var el = $('verdict');
    el.textContent = text || '';
    el.className = cls || '';
  }

  /* ─────────── вики ─────────── */
  var WIKI = [
    {
      title: 'Что такое MythicMobs',
      text: 'Плагин добавляет мобов с собственными характеристиками, скиллами, дропом и спавнерами. ' +
        'Настройки лежат в папке plugins/MythicMobs: Mobs — сами мобы, Skills — отдельные скиллы, ' +
        'DropTables — таблицы дропа, Spawners — спавнеры. После правки файлов выполняй mythicmobs reload.',
      code: '',
    },
    {
      title: 'Моб: минимальный рабочий файл',
      text: 'Имя моба — ключ верхнего уровня, дальше отступ в два пробела. Type обязателен, Health без него будет 1.',
      code: 'ZombieKing:\n  Type: ZOMBIE\n  Display: \'Король зомби\'\n  Health: 60\n  Damage: 6\n  Options:\n    MovementSpeed: 0.3',
    },
    {
      title: 'Скиллы',
      text: 'Скиллы описываются ключом Skills (не Skill) — список из строк. В фигурных скобках параметры, ' +
        'через собаку — цель, в конце — условие срабатывания.',
      code: 'ZombieKing:\n  Type: ZOMBIE\n  Health: 60\n  Skills:\n    - ignite{ticks=40} @Target ~onAttack\n    - potion{type=SLOW;duration=60;level=1} @Target ~onDamaged 0.3',
    },
    {
      title: 'Дроп',
      text: 'Дроп задаётся блоком Drops: что выпадет, с какой вероятностью и в каком количестве.',
      code: 'ZombieKing:\n  Type: ZOMBIE\n  Health: 60\n  Drops:\n    - diamond 1 0.15\n    - exp 25',
    },
    {
      title: 'Спавнеры',
      text: 'Спавнер ставит мобов в мире. Указывается моб, радиус, количество и период.',
      code: 'KingSpawner:\n  MobName: ZombieKing\n  World: world\n  SpawnRadius: 8\n  MaxMobs: 2\n  MobInterval: 300',
    },
    {
      title: 'Частые ошибки',
      text: 'Табуляция вместо пробелов — YAML её не принимает. Ключ Skill вместо Skills молча игнорируется. ' +
        'Забытый Health делает моба одноударным. Отступ в один пробел превращает параметр в мусор. ' +
        'Кнопка «Адаптация кода» исправляет всё это одной командой.',
      code: '',
    },
  ];

  function renderWiki() {
    var host = $('wikiList');
    host.textContent = '';
    WIKI.forEach(function (w) {
      var card = document.createElement('div');
      card.className = 'card';
      var h = document.createElement('h3');
      h.textContent = w.title;
      var p = document.createElement('p');
      p.textContent = w.text;
      card.appendChild(h);
      card.appendChild(p);
      if (w.code) {
        var pre = document.createElement('pre');
        pre.textContent = w.code;
        card.appendChild(pre);
      }
      host.appendChild(card);
    });
  }

  /* ─────────── адаптация кода ─────────── */
  function mobName(text) {
    var m = text.match(/^([A-Za-z0-9_\-]+)\s*:\s*$/m);
    return m ? m[1] : '';
  }

  function adapt(src) {
    var notes = [];
    var text = String(src || '').replace(/\r\n?/g, '\n');
    if (/\t/.test(text)) {
      text = text.replace(/\t/g, '  ');
      notes.push('нашёл табуляцию — заменил на два пробела');
    }
    if (/[ ]+$/m.test(text)) {
      text = text.replace(/[ ]+$/gm, '');
      notes.push('убрал пробелы в конце строк');
    }
    if (/^[ ]*Skill:\s*$/m.test(text)) {
      text = text.replace(/^([ ]*)Skill:\s*$/gm, '$1Skills:');
      notes.push('ключ Skill: исправлен на Skills:');
    } else if (/^[ ]*Skill:\s*$/m.test(text)) {
      text = text.replace(/^([ ]*)Skill:/gm, '$1Skills:');
    }
    var name = mobName(text);
    if (!/^[ ]*Type:/m.test(text)) {
      var head = text.match(/^([A-Za-z0-9_\-]+)\s*:\s*$/m);
      if (head) {
        var at = head.index + head[0].length;
        text = text.slice(0, at) + '\n  Type: ZOMBIE' + text.slice(at);
        notes.push('добавил обязательный Type');
      }
    }
    if (!/^[ ]*Health:/m.test(text)) {
      var typeLine = text.match(/^([ ]*)Type:.*$/m);
      if (typeLine) {
        var pos = typeLine.index + typeLine[0].length;
        text = text.slice(0, pos) + '\n  Health: 20' + text.slice(pos);
      } else {
        var head2 = text.match(/^([A-Za-z0-9_\-]+)\s*:\s*$/m);
        var at2 = head2 ? head2.index + head2[0].length : 0;
        text = text.slice(0, at2) + '\n  Health: 20' + text.slice(at2);
      }
      notes.push('добавил обязательный Health: 20');
    }
    text = text.replace(/\n{3,}/g, '\n\n');
    if (!text.endsWith('\n')) text += '\n';
    return { text: text, notes: notes, name: name || mobName(text) || 'NewMob' };
  }

  function fix() {
    var src = $('src').value;
    if (!src.trim()) { verdict('Вставь код моба — пусто адаптировать нечего', 'warn'); return; }
    var r = adapt(src);
    S.fixed = r.text;
    $('out').textContent = r.text;
    S.path = 'MythicMobs/Mobs/' + r.name + '.yml';
    $('savePath').value = S.path;
    $('saveBtn').disabled = false;
    verdict(r.notes.length
      ? 'Готово: ' + r.notes.join(' · ')
      : 'Готово: код уже в порядке, ни одной правки не понадобилось', r.notes.length ? 'ok' : '');
  }

  async function saveFile() {
    var path = ($('savePath').value || '').trim();
    if (!path) { verdict('Укажи путь файла', 'warn'); return; }
    if (!/\.yml$|\.yaml$/i.test(path)) path += '.yml';
    $('saveBtn').disabled = true;
    var res = await call('write', [path, S.fixed]);
    $('saveBtn').disabled = false;
    if (!res || !res.ok) { verdict('Не сохранилось: ' + ((res && res.error) || 'нет связи'), 'bad'); return; }
    var tail = '';
    if (S.server && S.server.running) {
      var r = await call('command', ['mythicmobs reload']);
      tail = r && r.ok ? ' · на сервере выполнен mythicmobs reload' : ' · перезагрузить плагин не удалось';
    } else {
      tail = ' · сервер не запущен, применится при следующем запуске';
    }
    verdict('Сохранено: ' + path + tail, 'ok');
  }

  /* ─────────── проверка файлов ─────────── */
  async function scan() {
    var host = $('files');
    host.textContent = '';
    $('scanInfo').textContent = 'Смотрю папку…';
    var dirs = ['MythicMobs/Mobs', 'MythicMobs', 'plugins/MythicMobs/Mobs'];
    var list = null;
    var base = '';
    for (var i = 0; i < dirs.length; i++) {
      var res = await call('list', [dirs[i]]);
      if (res && res.ok && res.data) { list = res.data; base = dirs[i]; break; }
    }
    if (!list) {
      $('scanInfo').textContent = '';
      verdict('Папка MythicMobs не найдена — плагин ещё не запускался', 'warn');
      var empty = document.createElement('div');
      empty.className = 'f';
      empty.textContent = 'MythicMobs/Mobs не найдена';
      host.appendChild(empty);
      return;
    }
    var items = (list.items || list || []).filter(function (x) {
      return x && !x.isDir && /\.(yml|yaml)$/i.test(x.name || '');
    });
    $('scanInfo').textContent = items.length ? ('файлов: ' + items.length + ' · ' + base) : 'ни одного .yml';
    var bad = 0;
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      var rel = it.path || (base + '/' + it.name);
      var read = await call('read', [rel]);
      var text = read && read.ok && read.data ? String(read.data.content || '') : '';
      var state = 'ок';
      var cls = 'ok';
      if (!text.trim()) { state = 'пустой файл'; cls = 'bad'; bad++; }
      else if (/\t/.test(text)) { state = 'табуляция — YAML не примет'; cls = 'bad'; bad++; }
      else if (!/^\s*Type:/m.test(text)) { state = 'нет Type'; cls = 'bad'; bad++; }
      else if (!/^\s*Health:/m.test(text)) { state = 'нет Health — моб одноударный'; cls = 'bad'; bad++; }
      var row = document.createElement('div');
      row.className = 'f';
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = it.name || rel;
      var st = document.createElement('span');
      st.className = 'st ' + cls;
      st.textContent = state;
      row.appendChild(n);
      row.appendChild(st);
      host.appendChild(row);
    }
    if (bad) $('scanInfo').textContent += ' · с замечаниями: ' + bad;
  }

  /* ─────────── вкладки ─────────── */
  var TABS = [
    { btn: 'tabWiki', view: 'vWiki' },
    { btn: 'tabFix', view: 'vFix' },
    { btn: 'tabFiles', view: 'vFiles' },
  ];
  TABS.forEach(function (t) {
    $(t.btn).addEventListener('click', function () {
      TABS.forEach(function (x) {
        $(x.btn).classList.toggle('on', x.btn === t.btn);
        $(x.view).classList.toggle('on', x.view === t.view);
      });
      if (t.view === 'vFix' && !$('src').value) verdict('');
    });
  });

  $('fixBtn').addEventListener('click', fix);
  $('saveBtn').addEventListener('click', saveFile);
  $('scanBtn').addEventListener('click', scan);

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.omni !== 2) return;
    if (d.type === 'init-ok') { applyTheme(d.theme); S.server = d.server; return; }
    if (d.type === 'theme') { applyTheme(d.theme); return; }
    if (d.type === 'server-changed') { S.server = d.server; return; }
    var w = waits.get(d.rid);
    if (w) { waits.delete(d.rid); w(d); }
  });

  renderWiki();
  call('init', []);
})();
</script>
</body>
</html>
