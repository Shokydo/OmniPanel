# Сборка OmniPanel на Rust под Windows — прямо на GitHub.
#
#   Actions → «Сборка под Windows» → Run workflow
#
# Что делает то же самое, что rust\собрать-под-windows.ps1 на вашей машине:
# ставит Rust, собирает окно (Tauri), установщик и портативную сборку,
# кладёт в артефакты, а по галочке «release» — ещё и в релиз.
#
# Windows-раннер GitHub уже содержит MSVC (Visual Studio Build Tools) и
# WebView2 — то есть ровно то, чего нет в песочнице, где писался переезд.

name: Сборка под Windows

# без этого gh release create отвечает 403 «Resource not accessible by integration»
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия сборки (например 1.27.0)'
        required: false
        default: '1.38.0'
      release:
        description: 'Опубликовать релиз с установщиком'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать панель и установщик
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Взять код
        uses: actions/checkout@v4

      - name: Поставить Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 1.91 нужен HTTPS-клиенту панели (ureq + rustls)
          toolchain: '1.91.0'

      - name: Кэш сборки
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/omnipanel-core/target
            rust/omnipanel-setup/target
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Тесты ядра написаны и проверены под Linux: часть из них поднимает
      # sh-скрипты и проверяет права файлов. На Windows-раннере они справочные —
      # сборку не блокируют, но их вывод видно в логе.
      - name: Тесты ядра (справочно)
        shell: pwsh
        continue-on-error: true
        working-directory: rust/omnipanel-core
        run: cargo test --release

      - name: Проверить код под Windows без Windows
        shell: pwsh
        run: python rust/windows-код.py

      - name: Сверить интерфейс с ядром
        # каждый метод API.* в интерфейсе должен существовать в httpApi,
        # каждый адрес /api/… — иметь маршрут, каждый канал — быть объявленным
        run: node ui/api-check.js

      - name: Проверить эффекты панели
        shell: pwsh
        run: node ui/fx-test.js

      - name: Собрать окно, портативную версию и установщик
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "1.38.0" }
          # PowerShell 7 читает UTF-8 без вопросов; у скрипта к тому же есть BOM,
          # чтобы он работал и в Windows PowerShell 5.1 на вашей машине
          pwsh -ExecutionPolicy Bypass -File rust\собрать-под-windows.ps1 -Version $version -With7z

      - name: Что получилось
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, @{n='МБ';e={[math]::Round($_.Length/1MB,1)}}

      - name: Отдать сборку
        uses: actions/upload-artifact@v4
        with:
          name: OmniPanel-win64
          path: |
            dist/OmniPanel-win64.zip
            dist/*.exe
          if-no-files-found: error

      - name: Релиз с установщиком
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "1.38.0" }
          $tag = "v$version"
          # gh на Windows теряет кириллицу в имени ассета — грузим под латинским
          $setup = "dist/OmniPanel-Setup-$version.exe"
          Copy-Item "dist/OmniPanel-Установка-$version.exe" $setup
          # в релизе только установщик; архив кода GitHub добавляет сам,
          # а портативная сборка лежит в артефактах этой сборки
          gh release create $tag `
            $setup `
            --title "OmniPanel $version на Rust" `
            --notes @"
          Панель управления серверами на Rust: одно окно, без Node.js и без PowerShell.

          **Установщик:** ``OmniPanel-Setup-$version.exe`` — своё тёмное окно (нарисовано в самом exe).

          - папку выбираете вы: список, кнопка «Выбрать папку» или ручной ввод;
            выбрали корень диска ``D:\`` — панель встанет в новую папку ``D:\OmniPanel``;
          - проверяются права на запись и свободное место, до распаковки;
          - рядом с панелью появляется ``Uninstall.exe`` — удаление с выбором,
            оставлять ли серверы и настройки;
          - после установки: «Запустить панель» и «Открыть папку».

          **Эффекты панели** (как в OmniSpec): частицы на фоне — снег, звёзды, пыль,
          палочки; след за курсором — искры, линия, кисть, свечение. Плотность,
          размер, длина, видимость и цвет настраиваются в «Эффектах».

          **Автообновление.** Панель сама спрашивает GitHub при запуске и дальше раз в 20 минут: если вышла новая версия — в шапке загорается плашка и появляется уведомление, в настройках остаётся нажать «Обновить и перезапустить».

Портативная сборка (``OmniPanel-win64.zip``) — во вкладке Actions → артефакты.
          "@
