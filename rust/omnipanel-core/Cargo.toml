[package]
name = "omnipanel-core"
version = "1.40.0"
edition = "2021"
description = "Ядро OmniPanel на Rust: серверы, файлы, настройки, порты"

[lib]
name = "omnipanel_core"
path = "src/lib.rs"

[dependencies]
# Единственная внешняя зависимость: HTTPS-клиент для GitHub, GitLab и обновлений.
# Своими руками TLS-рукопожатие не пишут — это способ сломать загрузку обновлений.
ureq = { version = "3", features = ["rustls"] }

[dev-dependencies]
# Ярлыки .lnk пишем сами (см. shortcut.rs), этот крейт — только чтобы в тестах
# читать готовый файл чужим парсером и убеждаться, что ярлык собран верно.
lnk = "0.6"
