[package]
name = "omnipanel-setup"
version = "1.38.0"
edition = "2021"
description = "Установщик OmniPanel на Rust: один exe с панелью внутри"

[[bin]]
name = "omnipanel-setup"
path = "src/main.rs"

[dependencies]
# Окно установщика рисуем сами (egui/eframe): ни PowerShell, ни WebView2, ни
# системных диалогов — exe остаётся одним файлом. Так же сделано в OmniSpec.
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
omnipanel-core = { path = "../omnipanel-core" }

# Иконка и сведения о файле для установщика и деинсталлятора: без секции
# ресурсов Windows показывает у exe стандартный значок.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
